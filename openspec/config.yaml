schema: spec-driven

context: |
  # Công nghệ & Kiến trúc (Tech Stack)
  - Framework: Next.js (App Router), React.
  - Ngôn ngữ: TypeScript (Strict mode).
  - Giao diện (UI): Tailwind CSS, kết hợp với các component của shadcn/ui.
  - Xử lý API ảo (Mock API): Sử dụng MSW (Mock Service Worker).
  
  # Kiến thức đặc thù của dự án (Domain Knowledge)
  - Đây là ứng dụng Plane Clone (hệ thống quản lý dự án, Kanban board giống Jira).
  - Toàn bộ dữ liệu trả về từ Database (trong thư mục mocks) bắt buộc dùng chuẩn `snake_case` (ví dụ: project_id, created_at, active_workspace_id).

rules:
  general:
    - Tuyệt đối KHÔNG dùng kiểu dữ liệu `any` trong TypeScript. Phải định nghĩa Type/Interface rõ ràng.
    - TUYỆT ĐỐI KHÔNG gọi hàm cập nhật State (ví dụ: setName, setSelected) một cách đồng bộ ngay bên trong `useEffect` để tránh lỗi cascading renders.
    - Ưu tiên sử dụng component `<Image />` của next/image thay cho thẻ `<img>` của HTML thuần.
    - Viết Clean Code: Không để lại các biến hoặc thư viện (import) đã khai báo nhưng không sử dụng.

operations:
  apply:
    guidance:
      - Khi tạo component mới, luôn viết code ngắn gọn, chia nhỏ component nếu quá 150 dòng.